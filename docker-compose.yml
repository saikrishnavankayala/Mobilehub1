version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mobile_hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mobile_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mobile_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mobile_hub_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: prod-mobile-hub-super-secret-key-change-in-prod-2026
      JWT_SECRET_KEY: prod-mobile-hub-jwt-secret-key-change-in-prod-2026
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mobile_hub
      OTP_PROVIDER: mock
      OTP_API_KEY: mock-key
      OTP_SENDER_ID: MOBHUB
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mobile_hub_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
